<div class="form-element relative p-3 border-1 border-transparent border-round" [class.preview-mode]="isPreview"
    [class.pl-6]="!isPreview" [class.pr-6]="!isPreview">

    <!-- Delete Button (Edit Mode Only) -->
    <div class="element-actions absolute top-0 right-0 p-2 z-2" *ngIf="!isPreview">
        <p-button icon="pi pi-trash" rounded="true" text="true" severity="danger"
            (onClick)="onDelete($event)"></p-button>
    </div>

    <div [ngSwitch]="element.type" class="w-100" [formGroup]="group">
        <!-- Text Inputs -->
        <div *ngSwitchCase="'text'" class="mb-3">
            <label class="form-label">{{ element.label }}</label>
            <input type="text" [placeholder]="element.placeholder || ''" [required]="element.required"
                class="form-control" [formControlName]="element.id">
        </div>

        <div *ngSwitchCase="'email'" class="mb-3">
            <label class="form-label">{{ element.label }}</label>
            <input type="email" [placeholder]="element.placeholder || ''" [required]="element.required"
                class="form-control" [formControlName]="element.id">
        </div>

        <div *ngSwitchCase="'password'" class="mb-3">
            <label class="form-label">{{ element.label }}</label>
            <input type="password" [placeholder]="element.placeholder || ''" [required]="element.required"
                class="form-control" [formControlName]="element.id">
        </div>

        <div *ngSwitchCase="'number'" class="mb-3">
            <label class="form-label">{{ element.label }}</label>
            <input type="number" [placeholder]="element.placeholder || ''" [required]="element.required"
                [min]="element.min!" [max]="element.max!" [step]="element.step!" class="form-control"
                [formControlName]="element.id">
        </div>

        <!-- Textarea -->
        <div *ngSwitchCase="'textarea'" class="mb-3">
            <label class="form-label">{{ element.label }}</label>
            <textarea [rows]="element.rows || 4" [placeholder]="element.placeholder || ''" [required]="element.required"
                class="form-control" [formControlName]="element.id">
      </textarea>
        </div>

        <!-- Select -->
        <div *ngSwitchCase="'select'" class="mb-3">
            <label class="form-label">{{ element.label }}</label>
            <select class="form-select" [required]="element.required" [formControlName]="element.id">
                <option value="" disabled selected>Select an option</option>
                <option *ngFor="let option of element.options" [value]="option">{{ option }}</option>
            </select>
        </div>

        <!-- Checkbox -->
        <div *ngSwitchCase="'checkbox'" class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" [id]="element.id" [formControlName]="element.id">
                <label class="form-check-label" [for]="element.id">
                    {{ element.label }}
                </label>
            </div>
        </div>

        <!-- Radio -->
        <div *ngSwitchCase="'radio'" class="mb-3">
            <label class="form-label d-block">{{ element.label }}</label>
            <div *ngFor="let option of element.options" class="form-check">
                <input class="form-check-input" type="radio" [value]="option" [id]="option"
                    [formControlName]="element.id">
                <label class="form-check-label" [for]="option">
                    {{ option }}
                </label>
            </div>
        </div>

        <!-- Date -->
        <div *ngSwitchCase="'date'" class="mb-3">
            <label class="form-label">{{ element.label }}</label>
            <input type="date" class="form-control" [required]="element.required" [formControlName]="element.id">
        </div>

        <!-- Buttons -->
        <div *ngSwitchCase="'button'" class="mb-3">
            <button type="button" class="btn btn-primary w-100">{{ element.label }}</button>
        </div>

        <div *ngSwitchCase="'submit'" class="mb-3">
            <button type="submit" class="btn btn-primary w-100">{{ element.label }}</button>
        </div>
    </div>
</div>
