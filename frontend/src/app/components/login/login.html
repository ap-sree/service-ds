<div class="login-container flex align-items-center justify-content-center min-h-screen surface-ground">
  <p-card styleClass="p-4 shadow-4 w-full md:w-30rem border-round-xl">
    <div class="text-center mb-5">
      <div class="text-900 text-3xl font-medium mb-3">Welcome Back</div>
      <span class="text-600 font-medium line-height-3">Sign in to continue</span>
    </div>

    <div class="flex flex-column gap-2 mb-3">
      <label for="username" class="block text-900 font-medium text-lg">Username</label>
      <input pInputText id="username" type="text" [(ngModel)]="username" class="w-full text-lg p-3"
        placeholder="Enter your username" (keydown.enter)="login()" [disabled]="loading" autofocus />
      </div>

      <div class="flex align-items-center justify-content-between mb-5 gap-5">
        <div class="flex align-items-center">
          <p-checkbox id="rememberme1" [binary]="true" styleClass="mr-2"></p-checkbox>
          <label for="rememberme1" class="text-900 font-medium">Remember me</label>
        </div>
      </div>

      <p-button label="Sign In" (click)="login()" styleClass="w-full text-lg p-3" [loading]="loading"
      [disabled]="!username"></p-button>

      @if (error) {
        <div class="text-red-500 text-center mt-3 font-medium">
          {{ error }}
        </div>
      }
    </p-card>
  </div>
