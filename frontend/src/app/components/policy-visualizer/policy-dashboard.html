<div class="policy-dashboard h-full px-5 py-3 md:px-6 md:py-4 surface-ground flex flex-column overflow-hidden">

    <div class="flex-grow-1 flex overflow-hidden">
        <div class="grid w-full m-0" style="min-height: calc(100vh - 9rem);">

            <!-- Sidebar: Title + Tabs + List -->
            <div class="col-3 p-0 pr-3 flex flex-column gap-3">

                <h2 class="text-2xl font-semibold m-0 text-900">Policy Dashboard</h2>

                <!-- Tabs -->
                <div class="flex surface-card shadow-1 border-round overflow-hidden">
                    <button pButton class="flex-1 p-button-text p-button-sm border-none border-noround text-700"
                        [class.bg-blue-50]="currentTab === 'policies'" [class.text-blue-600]="currentTab === 'policies'"
                        [class.font-bold]="currentTab === 'policies'" (click)="loadTab('policies')">
                        Policies
                    </button>

                    <button pButton class="flex-1 p-button-text p-button-sm border-none border-noround text-700"
                        [class.bg-blue-50]="currentTab === 'fragments'"
                        [class.text-blue-600]="currentTab === 'fragments'"
                        [class.font-bold]="currentTab === 'fragments'" (click)="loadTab('fragments')">
                        Fragments
                    </button>
                </div>

                <!-- List -->
                <div class="surface-card border-round shadow-1 p-3 flex-grow-1 flex flex-column overflow-hidden">
                    <h4 class="mt-0 mb-3 text-700 capitalize">{{currentTab}} ({{totalItemsCount}})</h4>
                    <p-listbox [options]="groupedPolicies" [(ngModel)]="selectedPolicy" [group]="isGrouped"
                        [style]="{'width':'100%', 'height': '100%'}" [listStyle]="{'max-height': '100%'}"
                        styleClass="border-none w-full flex-grow-1 custom-scrollbar" optionLabel="label"
                        optionValue="value">
                        <ng-template let-group pTemplate="group">
                            <div class="flex align-items-center">
                                <span class="font-bold">{{group.label}}</span>
                            </div>
                        </ng-template>
                        <ng-template let-policy pTemplate="item">
                            <div class="flex flex-column gap-1">
                                <span class="font-bold text-sm">{{policy.label}}</span>
                            </div>
                        </ng-template>
                    </p-listbox>
                </div>
            </div>

            <!-- Main Visualizer Area -->
            <div class="col-9 p-0 h-full">
                <div *ngIf="selectedPolicy; else selectPrompt" class="h-full flex flex-column p-0 overflow-hidden">
                    <!-- Policy Header Card -->
                    <div
                        class="p-3 mb-2 surface-card border-round shadow-1 flex align-items-center justify-content-between flex-shrink-0">
                        <h3 class="m-0 text-900">{{ getPolicyDisplayName(selectedPolicy) }}</h3>
                        <span class="text-500 text-sm">ID: {{selectedPolicy.id}}</span>
                    </div>

                    <!-- Visualizer -->
                    <div
                        class="flex-grow-1 flex flex-column overflow-hidden relative surface-card border-round shadow-1">
                        <app-policy-visualizer [policy]="selectedPolicy" [selectors]="selectors" [fragments]="fragments"
                            class="h-full w-full"></app-policy-visualizer>
                    </div>
                </div>

                <ng-template #selectPrompt>
                    <div class="flex align-items-center justify-content-center h-full border-round">
                        <div class="text-center">
                            <i class="pi pi-arrow-left text-4xl text-500 mb-3"></i>
                            <p class="text-500 text-xl m-0">Select an item from the list to view details.</p>
                        </div>
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
</div>
