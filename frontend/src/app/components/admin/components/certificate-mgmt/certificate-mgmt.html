<div class="px-5 py-3 md:px-6 md:py-4">
    <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>
    <p-toast></p-toast>

    <div class="split-layout">
        <h2 class="text-2xl font-bold mb-4">Certificates</h2>

        <div class="flex justify-content-between align-items-center mb-3">
            <p-iconField iconPosition="left">
                <p-inputIcon styleClass="pi pi-search" />
                <input type="text" pInputText (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Search..." />
            </p-iconField>

            <p-button label="Import Certificate" icon="pi pi-plus" (click)="openNew()"></p-button>
        </div>

        <p-card header="Manage Certificates" styleClass="p-0">
            <p-table #dt [value]="certificates" [rows]="10" [paginator]="true"
                [globalFilterFields]="['alias','subject','issuer']" [rowHover]="true" dataKey="alias"
                styleClass="p-datatable-sm" [showCurrentPageReport]="true"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries">

                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="alias">Alias <p-sortIcon field="alias"></p-sortIcon></th>
                        <th pSortableColumn="subject">Subject <p-sortIcon field="subject"></p-sortIcon></th>
                        <th pSortableColumn="validTo">Valid To <p-sortIcon field="validTo"></p-sortIcon></th>
                        <th pSortableColumn="issuer">Issuer <p-sortIcon field="issuer"></p-sortIcon></th>
                        <th>Actions</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-cert>
                    <tr>
                        <td>{{cert.alias}}</td>
                        <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                            [title]="cert.subject">
                            {{cert.subject}}
                        </td>
                        <td>{{cert.validTo | date:'mediumDate'}}</td>
                        <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                            [title]="cert.issuer">
                            {{cert.issuer}}
                        </td>
                        <td>
                            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                                (click)="deleteCertificate(cert)" pTooltip="Delete"></p-button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="5" class="text-center p-4">No certificates found.</td>
                    </tr>
                </ng-template>
            </p-table>
        </p-card>
    </div>
</div>

<p-dialog [(visible)]="certificateDialog" [style]="{width: '450px'}" header="Import Certificate" [modal]="true"
    styleClass="p-fluid">
    <ng-template pTemplate="content">
        <div class="p-fluid">
            <form [formGroup]="certForm">
                <div class="field mb-4">
                    <label for="file" class="font-bold block mb-2">Certificate File (.cer, .pem, .crt)</label>
                    <div class="flex align-items-center">
                        <p-fileUpload mode="basic" chooseLabel="Choose File" accept=".cer,.crt,.pem"
                            [maxFileSize]="1000000" (onSelect)="onFileSelect($event)" [auto]="true"
                            styleClass="w-full"></p-fileUpload>
                    </div>
                    <small *ngIf="selectedFile" class="text-green-500 block mt-2">Selected:
                        {{selectedFile.name}}</small>
                    <small class="p-error block mt-1" *ngIf="!selectedFile && certForm.dirty">File is required.</small>
                </div>

                <div class="field mb-4">
                    <label for="alias" class="font-bold block mb-2">Alias</label>
                    <input type="text" pInputText id="alias" formControlName="alias" class="w-full" autofocus />
                    <small class="p-error block mt-1"
                        *ngIf="certForm.get('alias')?.invalid && certForm.get('alias')?.dirty">Alias is
                        required.</small>
                </div>
            </form>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
        <button pButton pRipple label="Import" icon="pi pi-check" class="p-button-text" (click)="saveCertificate()"
            [disabled]="certForm.invalid || !selectedFile"></button>
    </ng-template>
</p-dialog>
