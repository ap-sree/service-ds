<form [formGroup]="ruleForm" class="p-fluid">
    <div class="field grid">
        <label for="localTableName" class="col-12 mb-2 md:col-3 md:mb-0 align-self-center font-bold">Target Sync
            Table <span class="text-red-500">*</span></label>
        <div class="col-12 md:col-9">
            <p-select id="localTableName" formControlName="localTableName" [options]="uniqueSyncs"
                optionLabel="targetTableName" optionValue="targetTableName" (onChange)="onRuleTableChange()"
                placeholder="Select Table" styleClass="w-full" appendTo="body"></p-select>
        </div>
    </div>

    <div class="field grid">
        <label class="col-12 mb-2 md:col-3 md:mb-0 align-self-center font-bold">Filtering (Optional)</label>
        <div class="col-12 md:col-9">
            <div class="flex gap-3">
                <div class="flex-1">
                    <label for="userColumn" class="block text-sm mb-1">Target User Column</label>
                    <p-select id="userColumn" formControlName="userColumn" [options]="tableColumns" [showClear]="true"
                        placeholder="Select Column" styleClass="w-full" appendTo="body"></p-select>
                </div>
                <div class="flex-1">
                    <label for="targetRole" class="block text-sm mb-1">Target Role</label>
                    <p-select id="targetRole" formControlName="targetRole" [options]="roles" optionLabel="label"
                        optionValue="value" placeholder="Select Role" styleClass="w-full" appendTo="body"></p-select>
                </div>
            </div>
            <small class="block text-gray-500 mt-1">Group by user column OR send to role</small>
        </div>
    </div>


    <div class="field grid">
        <label class="col-12 mb-2 md:col-3 md:mb-0 align-self-center font-bold">Condition <span
                class="text-red-500">*</span></label>
        <div class="col-12 md:col-9">
            <div class="surface-ground p-3 border-round border-1 surface-border" [formGroup]="ruleConditionForm">


                <div class="flex gap-2 mb-2">
                    <div class="field flex-1 mb-0">
                        <label class="text-sm">Operation</label>
                        <p-select formControlName="operation" [options]="operations" optionLabel="label"
                            optionValue="value" appendTo="body" styleClass="w-full"></p-select>
                    </div>
                    <div class="field flex-1 mb-0">
                        <label class="text-sm">Column</label>
                        <p-select formControlName="column" [options]="['*'].concat(tableColumns)" [editable]="true"
                            appendTo="body" styleClass="w-full"></p-select>
                    </div>
                </div>


                <div class="field mb-2">
                    <label class="text-sm">Filter (SQL WHERE)</label>
                    <input type="text" pInputText formControlName="condition" placeholder="e.g. status='FAILED'"
                        class="w-full" />
                </div>


                <div class="flex gap-2 align-items-end">
                    <span class="mb-2 font-bold">IF Result</span>
                    <div class="field flex-1 mb-0">
                        <p-select formControlName="thresholdOperator" [options]="operators" optionLabel="label"
                            optionValue="value" appendTo="body" styleClass="w-full"></p-select>
                    </div>
                    <div class="field flex-1 mb-0">
                        <input type="text" pInputText formControlName="thresholdValue" placeholder="Threshold (e.g. 0)"
                            class="w-full" />
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="field grid">
        <label for="titleTemplate" class="col-12 mb-2 md:col-3 md:mb-0 font-bold">Title Template <span
                class="text-red-500">*</span></label>
        <div class="col-12 md:col-9">
            <input id="titleTemplate" type="text" pInputText formControlName="titleTemplate" class="w-full" />
        </div>
    </div>

    <div class="field grid">
        <label for="messageTemplate" class="col-12 mb-2 md:col-3 md:mb-0 font-bold">Message Template <span
                class="text-red-500">*</span></label>
        <div class="col-12 md:col-9">
            <textarea id="messageTemplate" rows="2" pTextarea formControlName="messageTemplate"
                class="w-full"></textarea>
            <small class="block mt-1">Use {{"{{value}}"}} for actual value</small>
        </div>
    </div>

    <div class="field grid">
        <label for="actionType" class="col-12 mb-2 md:col-3 md:mb-0 align-self-center font-bold">Configuration</label>
        <div class="col-12 md:col-9">
            <div class="flex gap-3">
                <div class="flex-1">
                    <label for="actionType" class="block text-sm mb-1">Notification Type <span
                            class="text-red-500">*</span></label>
                    <p-select id="actionType" formControlName="actionType" [options]="actionTypes" optionLabel="label"
                        optionValue="value" styleClass="w-full" appendTo="body"></p-select>
                </div>
                <div class="flex-1">
                    <label for="scheduleType" class="block text-sm mb-1">Schedule Type <span
                            class="text-red-500">*</span></label>
                    <p-select id="scheduleType" formControlName="scheduleType" [options]="scheduleTypes"
                        optionLabel="label" optionValue="value" styleClass="w-full" appendTo="body"></p-select>
                </div>
            </div>
        </div>
    </div>

    @if (ruleForm.get('scheduleType')?.value !== 'EVENT') {
    <div class="field grid">
        <label for="scheduleConfig" class="col-12 mb-2 md:col-3 md:mb-0 align-self-center font-bold">Schedule
            Config</label>
        <div class="col-12 md:col-9">
            <input id="scheduleConfig" type="text" pInputText formControlName="scheduleConfig"
                placeholder="*/5 * * * * or 60" class="w-full" />
        </div>
    </div>
    }

    <div class="flex justify-content-end gap-2 mt-4">
        <p-button label="Cancel" (click)="cancel()" [text]="true" severity="secondary"></p-button>
        <p-button label="Save" (click)="save()" [loading]="loading"
            [disabled]="ruleForm.invalid || ruleConditionForm.invalid"></p-button>
    </div>
</form>
