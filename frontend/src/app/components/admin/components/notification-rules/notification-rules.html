<div class="px-5 py-3 md:px-6 md:py-4">
    <p-confirmDialog></p-confirmDialog>

    <div class="split-layout">
        <h2 class="text-2xl font-bold mb-4">Notification Rules</h2>

        <div class="flex justify-content-between align-items-center mb-3">
            <p-iconfield iconPosition="left">
                <p-inputicon styleClass="pi pi-search" />
                <input type="text" pInputText (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Search..." />
            </p-iconfield>

            <p-button label="Create Rule" icon="pi pi-plus" (click)="openDialog()"></p-button>
        </div>

        <p-card header="Notification Rules" styleClass="p-0">
            <p-table #dt [value]="dataSource" [rows]="5" [paginator]="true"
                [globalFilterFields]="['localTableName', 'actionType', 'scheduleType']" [rowHover]="true" dataKey="id"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
                [showCurrentPageReport]="true">

                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="localTableName">Target Table <p-sortIcon
                                field="localTableName"></p-sortIcon></th>
                        <th>Condition</th>
                        <th pSortableColumn="actionType">Action <p-sortIcon field="actionType"></p-sortIcon></th>
                        <th pSortableColumn="scheduleType">Schedule <p-sortIcon field="scheduleType"></p-sortIcon>
                        </th>
                        <th>Actions</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rule>
                    <tr>
                        <td class="font-bold">
                            @if (rule.schemaChanged) {
                            <i class="pi pi-exclamation-triangle text-orange-500 mr-1" pTooltip="Needs review"></i>
                            }
                            {{rule.localTableName}}
                        </td>
                        <td><code class="code-badge">{{formatCondition(rule.condition)}}</code></td>
                        <td><p-tag [value]="rule.actionType"
                                [severity]="rule.actionType === 'TOAST' ? 'info' : (rule.actionType === 'EMAIL' ? 'warn' : 'danger')"></p-tag>
                        </td>
                        <td>
                            {{rule.scheduleType}}
                            @if (rule.scheduleType !== 'EVENT') {
                            <span class="text-gray-500 text-sm">({{rule.scheduleConfig}})</span>
                            }
                        </td>
                        <td>
                            <div class="flex gap-2">
                                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (click)="openDialog(rule)"
                                    pTooltip="Edit"></p-button>
                                <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                                    (click)="deleteRule($event, rule.id!)" pTooltip="Delete"></p-button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="5" class="text-center p-4">No notification rules found.</td>
                    </tr>
                </ng-template>
            </p-table>
        </p-card>
    </div>
</div>
