<div class="px-5 py-3 md:px-6 md:py-4">
    <p-confirmDialog></p-confirmDialog>

    <div class="split-layout">
        <h2 class="text-2xl font-bold mb-4">Notification Rules</h2>

        <div class="flex justify-content-between align-items-center mb-3">
            <p-iconfield iconPosition="left">
                <p-inputicon styleClass="pi pi-search" />
                <input type="text" pInputText (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Search..." />
            </p-iconfield>

            <p-button label="Create Rule" icon="pi pi-plus" (click)="openDialog()"></p-button>
        </div>

        <p-card header="Notification Rules" styleClass="p-0">
            <p-table #dt [value]="dataSource" [rows]="5" [paginator]="true"
                [globalFilterFields]="['local_table_name', 'action_type', 'schedule_type']" [rowHover]="true"
                dataKey="id" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
                [showCurrentPageReport]="true">

                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="local_table_name">Target Table <p-sortIcon
                                field="local_table_name"></p-sortIcon></th>
                        <th pSortableColumn="condition_json">Condition <p-sortIcon field="condition_json"></p-sortIcon>
                        </th>
                        <th pSortableColumn="action_type">Action <p-sortIcon field="action_type"></p-sortIcon></th>
                        <th pSortableColumn="schedule_type">Schedule <p-sortIcon field="schedule_type"></p-sortIcon>
                        </th>
                        <th>Actions</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rule>
                    <tr>
                        <td class="font-bold">{{rule.local_table_name}}</td>
                        <td><code class="code-badge">{{formatCondition(rule.condition_json)}}</code></td>
                        <td><p-tag [value]="rule.action_type"
                                [severity]="rule.action_type === 'TOAST' ? 'info' : (rule.action_type === 'EMAIL' ? 'warn' : 'danger')"></p-tag>
                        </td>
                        <td>
                            {{rule.schedule_type}}
                            @if (rule.schedule_type !== 'EVENT') {
                            <span class="text-gray-500 text-sm">({{rule.schedule_config}})</span>
                            }
                        </td>
                        <td>
                            <div class="flex gap-2">
                                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (click)="openDialog(rule)"
                                    pTooltip="Edit"></p-button>
                                <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                                    (click)="deleteRule($event, rule.id!)" pTooltip="Delete"></p-button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="5" class="text-center p-4">No notification rules found.</td>
                    </tr>
                </ng-template>
            </p-table>
        </p-card>
    </div>
</div>
