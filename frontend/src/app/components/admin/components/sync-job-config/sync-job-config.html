<div class="px-5 py-3 md:px-6 md:py-4">
    <p-confirmDialog></p-confirmDialog>

    <div class="split-layout">
        <h2 class="text-2xl font-bold mb-4">Sync Jobs</h2>

        <div class="flex justify-content-between align-items-center mb-3">
            <p-iconfield iconPosition="left">
                <p-inputicon styleClass="pi pi-search" />
                <input type="text" pInputText (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Search..." />
            </p-iconfield>

            <p-button label="Create Sync Job" icon="pi pi-plus" (click)="openDialog()"></p-button>
        </div>

        <p-card header="Scheduled Sync Jobs" styleClass="p-0">
            <p-table #dt [value]="dataSource" [rows]="5" [paginator]="true"
                [globalFilterFields]="['target_table_name', 'sync_mode', 'last_status']" [rowHover]="true" dataKey="id"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
                [showCurrentPageReport]="true">

                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="target_table_name">Target Table <p-sortIcon
                                field="target_table_name"></p-sortIcon>
                        </th>
                        <th pSortableColumn="sync_mode">Mode <p-sortIcon field="sync_mode"></p-sortIcon></th>
                        <th pSortableColumn="last_status">Last Status <p-sortIcon field="last_status"></p-sortIcon></th>
                        <th pSortableColumn="last_run_at">Last Run <p-sortIcon field="last_run_at"></p-sortIcon></th>
                        <th>Actions</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-job>
                    <tr>
                        <td class="font-bold">{{job.target_table_name}}</td>
                        <td>
                            {{job.sync_mode}}
                            @if (job.schedule_config && job.sync_mode !== 'MANUAL') {
                            <span class="text-gray-500 text-sm">({{job.schedule_config}})</span>
                            }
                        </td>
                        <td>
                            <span class="font-bold"
                                [ngClass]="{'text-green-500': job.last_status === 'SUCCESS', 'text-red-500': job.last_status && job.last_status !== 'SUCCESS', 'text-orange-500': !job.last_status}">
                                {{job.last_status || 'Pending'}}
                            </span>
                        </td>
                        <td class="text-sm text-gray-500">{{job.last_run_at | date:'short'}}</td>
                        <td>
                            <div class="flex gap-2">
                                <p-button icon="pi pi-play" [rounded]="true" [text]="true" severity="help"
                                    (click)="triggerSync(job.id!)" pTooltip="Run Now"
                                    [loading]="loadingJobs.has(job.id!)"></p-button>
                                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (click)="openDialog(job)"
                                    pTooltip="Edit"></p-button>
                                <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                                    (click)="deleteSync($event, job.id!)" pTooltip="Delete"></p-button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="5" class="text-center p-4">No sync jobs found.</td>
                    </tr>
                </ng-template>
            </p-table>
        </p-card>
    </div>
</div>
