<div class="px-5 py-3 md:px-6 md:py-4">
    <p-confirmDialog></p-confirmDialog>

    <div class="split-layout">
        <h2 class="text-2xl font-bold mb-4">Sync Jobs</h2>

        <div class="flex justify-content-between align-items-center mb-3">
            <p-iconfield iconPosition="left">
                <p-inputicon styleClass="pi pi-search" />
                <input type="text" pInputText (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Search..." />
            </p-iconfield>

            <p-button label="Create Sync Job" icon="pi pi-plus" (click)="openDialog()"></p-button>
        </div>

        <p-card header="Scheduled Sync Jobs" styleClass="p-0">
            <p-table #dt [value]="dataSource" [rows]="5" [paginator]="true"
                [globalFilterFields]="['targetTableName', 'syncMode', 'lastStatus']" [rowHover]="true" dataKey="id"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
                [showCurrentPageReport]="true">

                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="targetTableName">Target Table <p-sortIcon
                                field="targetTableName"></p-sortIcon>
                        </th>
                        <th pSortableColumn="syncMode">Mode <p-sortIcon field="syncMode"></p-sortIcon></th>
                        <th pSortableColumn="lastStatus">Last Status <p-sortIcon field="lastStatus"></p-sortIcon></th>
                        <th pSortableColumn="lastRunAt">Last Run <p-sortIcon field="lastRunAt"></p-sortIcon></th>
                        <th>Actions</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-job>
                    <tr>
                        <td class="font-bold">{{job.targetTableName}}</td>
                        <td>
                            {{job.syncMode}}
                            @if (job.scheduleConfig && job.syncMode !== 'MANUAL') {
                            <span class="text-gray-500 text-sm">({{job.scheduleConfig}})</span>
                            }
                        </td>
                        <td>
                            <span class="font-bold"
                                [ngClass]="{'text-green-500': job.lastStatus === 'SUCCESS', 'text-red-500': job.lastStatus && job.lastStatus !== 'SUCCESS', 'text-orange-500': !job.lastStatus}">
                                {{job.lastStatus || 'Pending'}}
                            </span>
                        </td>
                        <td class="text-sm text-gray-500">{{job.lastRunAt | date:'short'}}</td>
                        <td>
                            <div class="flex gap-2">
                                <p-button icon="pi pi-play" [rounded]="true" [text]="true" severity="help"
                                    (click)="triggerSync(job.id!)" pTooltip="Run Now"
                                    [loading]="loadingJobs.has(job.id!)"></p-button>
                                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (click)="openDialog(job)"
                                    pTooltip="Edit"></p-button>
                                <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                                    (click)="deleteSync($event, job.id!)" pTooltip="Delete"></p-button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="5" class="text-center p-4">No sync jobs found.</td>
                    </tr>
                </ng-template>
            </p-table>
        </p-card>
    </div>
</div>
