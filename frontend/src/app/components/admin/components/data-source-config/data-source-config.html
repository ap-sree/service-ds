<div class="px-5 py-3 md:px-6 md:py-4">
    <p-confirmDialog></p-confirmDialog>

    <div class="split-layout">
        <h2 class="text-2xl font-bold mb-4">Data Sources</h2>

        <div class="flex justify-content-between align-items-center mb-3">
            <p-iconfield iconPosition="left">
                <p-inputicon styleClass="pi pi-search" />
                <input type="text" pInputText (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                    placeholder="Search..." />
            </p-iconfield>

            <p-button label="Add Source" icon="pi pi-plus" (click)="openDialog()"></p-button>
        </div>

        <p-card header="Registered Sources" styleClass="p-0">
            <p-table #dt [value]="dataSource" [rows]="5" [paginator]="true"
                [globalFilterFields]="['name', 'type', 'id']" [rowHover]="true" dataKey="id"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
                [showCurrentPageReport]="true">

                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>

                        <th pSortableColumn="type">Type <p-sortIcon field="type"></p-sortIcon></th>
                        <th pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
                        <th>Actions</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-source>
                    <tr>
                        <td>{{source.name}}</td>
                        <td>{{source.type}}</td>
                        <td>{{source.id}}</td>
                        <td>
                            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (click)="openDialog(source)"
                                pTooltip="Edit"></p-button>
                            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                                (click)="deleteSource($event, source.id)" pTooltip="Delete"></p-button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="4" class="text-center p-4">No sources found.</td>
                    </tr>
                </ng-template>
            </p-table>
        </p-card>
    </div>
</div>
