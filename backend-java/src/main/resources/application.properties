# Server Configuration
server.port=8080

# Database Configuration (H2 - Encrypted)
# File-based H2 database with AES encryption
spring.datasource.url=jdbc:h2:file:./data/appdb;CIPHER=AES
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=changeme filepwd changeme

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
# Use 'update' to auto-create/update schema on first run
spring.jpa.hibernate.ddl-auto=update

# Allow Hibernate to quote identifiers (fixes issues with reserved words)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Logging
logging.level.org.springframework.web=INFO



