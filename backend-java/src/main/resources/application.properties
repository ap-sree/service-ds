# JPA Configuration - OLD

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database Configuration - H2 Local File (Encrypted)
spring.datasource.url=jdbc:h2:file:./data/appdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;CIPHER=AES;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=changeme filepwd changeme
#spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate / JPA
#spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=APP

# Initialize schema from script (optional - un-comment if you want Spring to run the script)
#spring.sql.init.mode=always
#spring.sql.init.platform=h2

# Allow Hibernate to quote identifiers (fixes issues with reserved words)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.engine.jdbc.env.internal=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

# Console Log Pattern with MDC (Time Level [Thread] [User] [IP] Class : Message)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{userId:-system}] [%X{ip:-}] %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=when-authorized


# SSL Bundle

spring.ssl.bundle.jks.server.truststore.location=G:\\AntiGravity Project\\service-dashboard\\truststore.jks
spring.ssl.bundle.jks.server.truststore.password=changeit
spring.ssl.bundle.jks.server.reload-on-update=true 

