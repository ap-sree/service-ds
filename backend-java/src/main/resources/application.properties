# Server Configuration
server.port=8080

# Spring Cloud Vault Configuration
spring.config.import=vault://
spring.cloud.vault.enabled=true
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.authentication=approle
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID}
# KV Backend (v2)
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=kv
spring.cloud.vault.kv.default-context=application

spring.datasource.url=${db_url}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
# Use 'update' to auto-create/update schema on first run
spring.jpa.hibernate.ddl-auto=none

# Allow Hibernate to quote identifiers (fixes issues with reserved words)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Logging
logging.level.org.springframework.web=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=when-authorized



