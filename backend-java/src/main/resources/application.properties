
spring.main.banner-mode=off
# Server Configuration
spring.config.import=vault://
server.port=8080
server.servlet.context-path=/api

# OAuth2 Resource Server - JWT Validation
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://apspf.dnh8duakb5hhcwcu.eastus.azurecontainer.io:9031/pf/JWKS
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://apspf.dnh8duakb5hhcwcu.eastus.azurecontainer.io:9031

# Local Dev: Skip hostname check (cert CN=localhost vs Azure DNS)
app.ssl.disable-hostname-verification=true

# Spring Cloud Vault Configuration
spring.cloud.vault.enabled=true
spring.cloud.vault.uri=http://aps-hsv.c6h5awbhfpc5avhn.southindia.azurecontainer.io:8200
spring.cloud.vault.authentication=approle
spring.cloud.vault.app-role.role-id=9184e8d9-1ab9-a72b-f1c6-0b5a707e0cf9
spring.cloud.vault.app-role.secret-id=32bea814-6b4e-e62b-6407-91532bed8af5
spring.cloud.vault.kv.backend=kv
spring.cloud.vault.kv.default-context=application

