# Database Configuration - SQL Server
spring.datasource.url=${db_url}
spring.datasource.username=${db_username}
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# H2 Console
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=app

# Initialize schema from script (optional - un-comment if you want Spring to run the script)
# spring.sql.init.mode=always
# spring.sql.init.platform=mssql

# Allow Hibernate to quote identifiers (fixes issues with reserved words)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.engine.jdbc.env.internal=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=when-authorized


# SSL Bundle

##spring.ssl.bundle.jks.server.keystore.location=file:./data/truststore.jks
