
automation.retention.blob-days=7
automation.retention.record-days=30
# ─────────────────────────────────────────────────────────────────────────────

spring.main.banner-mode=off
spring.messages.basename=ValidationMessages

# Exclude LDAP Repositories to avoid conflict with JPA
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.ldap.LdapRepositoriesAutoConfiguration
# Server Configuration
#spring.config.import=vault://
server.port=8080
server.servlet.context-path=/api

# OAuth2 Resource Server - JWT Validation
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://localhost:9031/pf/JWKS


# Local Dev: Skip hostname check (cert CN=localhost vs Azure DNS)
app.ssl.disable-hostname-verification=true

