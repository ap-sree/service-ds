# Server Configuration
server.port=8080

# Database Configuration (SQLite)
# Pointing to the EXISTING app.db in the parent backend folder
spring.datasource.url=jdbc:sqlite:../backend/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA Configuration
# We use SQLiteDialect to ensure Hibernate understands SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true
# Do NOT use 'update' or 'create' on existing production DB to avoid accidental data loss. 
# 'validate' or 'none' is safer since schema exists.
spring.jpa.hibernate.ddl-auto=none

# Allow Hibernate to quote identifiers (fixes issues with reserved words)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.servicedashboard=DEBUG

# JSON Configuration (Parity with Node.js/DB Columns)
spring.jackson.property-naming-strategy=SNAKE_CASE
